<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeMaestro</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0;
      color: #fff;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #444;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4CAF50;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Stats Section */
    .stats-card {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    .stats-card p {
      margin: 4px 0;
      font-size: 0.9rem;
      color: #aaa;
    }
    .stats-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
      display: block;
    }

    /* Controls */
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .control-group {
      margin-bottom: 16px;
    }
    .control-label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #bbb;
    }
    .control-row .control-label {
      margin-bottom: 0;
    }
    select {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      font-size: 0.95rem;
    }
    input[type=range] {
      width: 100%;
      accent-color: #4CAF50;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">TypeMaestro</h1>
    <label class="switch">
      <input type="checkbox" id="powerToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats-card">
    <p>Typing Pace</p>
    <span class="stats-value" id="wpmDisplay">0 WPM</span>
    <p id="statusDisplay">Awaiting input...</p>
  </div>

  <div class="control-row">
    <span class="control-label">Keystroke Tones</span>
    <label class="switch">
      <input type="checkbox" id="keyTonesToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="control-group">
    <label class="control-label" for="instrumentSelect">Keystroke Instrument</label>
    <select id="instrumentSelect">
      <option value="Grand Piano">🎹 Grand Piano</option>
      <option value="Crystal Chimes">🔔 Crystal Chimes</option>
      <option value="Wood Marimba">🪵 Wood Marimba</option>
      <option value="Retro Synth">👾 Retro Synthesizer</option>
      <option value="Ethereal Pad">🌌 Ethereal Pad</option>
    </select>
  </div>

  <div class="control-group">
    <label class="control-label" for="keystrokeVolumeSlider">Keystroke Tones Volume</label>
    <input type="range" id="keystrokeVolumeSlider" min="0" max="1" step="0.05" value="0.8">
  </div>

  <div class="control-row" style="margin-top: 12px;">
    <span class="control-label">Ambient Music Flow</span>
    <label class="switch">
      <input type="checkbox" id="ambientToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="control-group">
    <label class="control-label" for="presetSelect">Ambient Mood Preset</label>
    <select id="presetSelect">
      <option value="Deep Focus">Deep Focus</option>
      <option value="Ambient Dream">Ambient Dream</option>
      <option value="Lofi Chill">Lofi Chill</option>
    </select>
  </div>

  <div class="control-group">
    <label class="control-label" for="ambientVolumeSlider">Ambient Music Volume</label>
    <input type="range" id="ambientVolumeSlider" min="0" max="1" step="0.05" value="0.3">
  </div>

  <div class="control-group">
    <label class="control-label" for="volumeSlider">Master Volume</label>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
